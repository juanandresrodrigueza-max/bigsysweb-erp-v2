<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BigSys</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;text-align:center;padding:24px;box-sizing:border-box;
    background:radial-gradient(90% 70% at 10% 0%,rgba(200,22,106,.55) 0%,rgba(200,22,106,0) 60%),radial-gradient(70% 60% at 100% 100%,rgba(79,48,137,.6) 0%,rgba(79,48,137,0) 60%),linear-gradient(180deg,#2b0a4f 0%,#1e0732 55%,#1b0a16 100%)}
  h1{font-weight:300;font-size:28px;margin:18px 0 6px;letter-spacing:-.01em}
  p{color:rgba(255,255,255,.75);max-width:320px;line-height:1.5;margin:0 auto}
  .logo{font:italic 800 44px Montserrat,-apple-system,sans-serif}.logo small{font:600 16px -apple-system,sans-serif;margin-left:4px;color:#c5bcdd}
  button{margin-top:22px;border:0;border-radius:999px;padding:12px 22px;color:#fff;font-weight:600;font-size:15px;background:linear-gradient(90deg,#e4003f 0%,#c8166a 55%,#a42785 100%);box-shadow:0 10px 30px rgba(228,0,63,.3)}
</style>
</head>
<body>
  <div>
    <div class="logo">BigSys<small>web</small></div>
    <h1>Sin conexión</h1>
    <p>No llegamos al servidor. Cuando vuelva internet, tocá reintentar y seguís donde estabas.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
