<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f3089"/><stop offset=".55" stop-color="#a42785"/><stop offset="1" stop-color="#e4003f"/>
    </linearGradient>
    <radialGradient id="luz" cx=".28" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barra" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd3df"/><stop offset="1" stop-color="#fff"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" rx="0" fill="url(#luz)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <!-- B: asta y dos panzas, la de abajo más ancha -->
    <path d="M168 120 V392 M168 120 H270 a68 68 0 0 1 0 136 H168 M168 256 H290 a68 68 0 0 1 0 136 H168" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- barras que crecen: la gestión del negocio, dentro de la panza de abajo -->
    <rect x="224" y="326" width="20" height="24" rx="5" fill="#fff" opacity=".6"/>
    <rect x="254" y="310" width="20" height="40" rx="5" fill="#fff" opacity=".8"/>
    <rect x="284" y="294" width="20" height="56" rx="5" fill="#fff"/>
    <!-- chispa -->
    <circle cx="388" cy="132" r="22" fill="url(#barra)"/>
  </g>
</svg>