name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    name: Pruebas (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath,exif,gd,mbstring,pdo,pdo_sqlite,sqlite3,zip,intl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: cp .env.example .env && php artisan key:generate
      # Las pruebas usan SQLite en memoria (ver phpunit.xml). La suite con PostgreSQL se suma en la fase de base de datos y escala.
      - run: php artisan test --compact
  build:
    name: Build del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
  lint:
    name: Sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: find app database routes config tests -name "*.php" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
